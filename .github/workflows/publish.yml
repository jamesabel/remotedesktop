# Publishes to PyPI with Provenance (PEP 740 attestations). Run manually (workflow_dispatch), on explicit request only.
#
# Uses PyPI "trusted publishing" (OIDC), so no API token secret is needed. The trusted publisher is registered at
#   https://pypi.org/manage/project/remotedesktop/settings/publishing/
#   Owner: jamesabel   Repository: remotedesktop   Workflow: publish.yml   Environment: pypi
#
# Release procedure:
#   1. merge the version-bump PR; release.yml tags it and creates the GitHub release
#   2. when a PyPI release is wanted, run this workflow from the default branch (Actions > Publish to PyPI > Run workflow)
#   3. never upload from a workstation: a local upload cannot produce Provenance

name: Publish to PyPI

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC token for trusted publishing and for signing the attestations
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
